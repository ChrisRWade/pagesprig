appId: org.pagesprig.app
productName: PageSprig
copyright: Copyright © PageSprig contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/node_modules/pdfjs-dist/**'
extraResources:
  - from: samples
    to: samples
    filter:
      - '*.pdf'
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
win:
  icon: icon.ico
  target:
    - nsis
    - portable
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PageSprig
  uninstallDisplayName: PageSprig
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}
linux:
  icon: icon.png
  category: Education
  maintainer: PageSprig contributors
  synopsis: A schoolwork notebook for PDF worksheets
  executableName: pagesprig
  syncDesktopName: true
  desktop:
    entry:
      Name: PageSprig
      Comment: Complete school worksheets and take notes on PDFs
      Categories: Education;Office;
  target:
    - deb
    - AppImage
deb:
  packageName: pagesprig
  packageCategory: education
publish:
  provider: github
  owner: ChrisRWade
  repo: pagesprig
  releaseType: release
electronVersion: 37.4.0
