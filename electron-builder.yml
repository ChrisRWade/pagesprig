appId: org.studypdf.app
productName: StudyPDF
copyright: Copyright © StudyPDF contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/node_modules/pdfjs-dist/**'
extraResources:
  - from: samples
    to: samples
    filter:
      - '*.pdf'
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyPDF
  uninstallDisplayName: StudyPDF
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}
publish:
  provider: github
  owner: ChrisRWade
  repo: study-pdf
  releaseType: release
electronVersion: 37.4.0
