name: Bug report
description: Report a problem in StudyPDF
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StudyPDF version
  - type: textarea
    id: extra
    attributes:
      label: Extra detail
      description: OS version, PDF page count, and whether the original PDF still opens. Do not attach real student work.
